<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="generator" content="Human-directed with Super Intelligence code assistance">
<meta name="si-disclosure" content="Code structure, theming, and UI enhancements generated with SI assistance; mission parameters derived from public NASA datasets.">
<title>Junior Astronaut Mission Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Default Deep Space Theme (Opening Page) */
  --bg:#060913;
  --bg-grad:radial-gradient(circle at 20% 15%, rgba(45,75,165,.22) 0%, transparent 50%),
            radial-gradient(circle at 82% 80%, rgba(110,55,165,.16) 0%, transparent 50%),
            linear-gradient(180deg, #050811 0%, #0b1224 100%);
  --card:#121b33;
  --card-glass:rgba(18,27,51,.86);
  --line:#283860;
  --ink:#eef2fb;
  --mute:#9eabcc;
  --org:#ff8a3d;
  --teal:#3fd2c0;
  --grn:#8bd45a;
  --red:#ff5d6c;
  --yel:#ffd166;
  --onorg:#1a0f05;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* Moon Mode Theme */
:root[data-site="moon"]{
  --bg:#0d1017;
  --bg-grad:radial-gradient(circle at 85% 12%, rgba(210,224,245,.20) 0%, transparent 45%),
            radial-gradient(circle at 15% 88%, rgba(120,138,168,.16) 0%, transparent 50%),
            linear-gradient(180deg, #0b0e14 0%, #171c26 55%, #222834 100%);
  --card:#191f2b;
  --card-glass:rgba(25,31,43,.88);
  --line:#3a4459;
  --ink:#f1f5fc;
  --mute:#aeb9ce;
  --org:#7dd3fc;
  --teal:#a5f3fc;
  --onorg:#081826;
}

/* Mars Mode Theme (Black & Red) */
:root[data-site="mars"]{
  --bg:#050202;
  --bg-grad:radial-gradient(circle at 82% 16%, rgba(220,38,38,.26) 0%, transparent 48%),
            radial-gradient(circle at 16% 85%, rgba(153,27,27,.22) 0%, transparent 52%),
            linear-gradient(180deg, #040101 0%, #120405 55%, #1d0709 100%);
  --card:#140608;
  --card-glass:rgba(20,6,8,.90);
  --line:#4a151b;
  --ink:#fceeed;
  --mute:#cfa3a7;
  --org:#ef4444;
  --teal:#f87171;
  --yel:#fca5a5;
  --onorg:#ffffff;
}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background-color:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--ink);
  font:16px/1.5 Nunito,system-ui,sans-serif;
  overflow-x:hidden;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  transition:background-color .6s ease,color .4s ease;
}

/* Decorative Horizon / Planet Backdrop Layer */
#backdrop-art{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  transition:opacity .6s ease;
}
#backdrop-art::before,
#backdrop-art::after{
  content:"";position:absolute;transition:all .8s cubic-bezier(.22,1,.36,1);
}

/* Default Space Theme Nebula Ring */
:root:not([data-site]) #backdrop-art::before{
  width:520px;height:520px;top:-180px;right:-140px;border-radius:50%;
  background:radial-gradient(circle,rgba(63,210,192,.09) 0%,rgba(59,130,246,.05) 45%,transparent 70%);
}

/* Moon Mode Cratered Lunar Surface & Earthrise Glow */
:root[data-site="moon"] #backdrop-art::before{
  width:240px;height:240px;top:36px;right:6%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #f8fafc 0%, #cbd5e1 45%, #64748b 82%, #334155 100%);
  box-shadow:0 0 70px rgba(203,213,225,.22), inset -18px -18px 36px rgba(15,23,42,.55);
  opacity:.35;
}
:root[data-site="moon"] #backdrop-art::after{
  left:-10%;right:-10%;bottom:-90px;height:180px;border-radius:50% 50% 0 0;
  background:radial-gradient(ellipse at 50% 0%, #333c4d 0%, #1c222e 65%, #11151d 100%);
  border-top:2px solid rgba(148,163,184,.28);
  box-shadow:0 -12px 40px rgba(148,163,184,.12);
}

/* Mars Mode Crimson Planet & Red Horizon */
:root[data-site="mars"] #backdrop-art::before{
  width:260px;height:260px;top:32px;right:5%;border-radius:50%;
  background:radial-gradient(circle at 32% 32%, #f87171 0%, #b91c1c 48%, #450a0a 85%, #1a0303 100%);
  box-shadow:0 0 80px rgba(220,38,38,.3), inset -22px -22px 40px rgba(0,0,0,.75);
  opacity:.38;
}
:root[data-site="mars"] #backdrop-art::after{
  left:-10%;right:-10%;bottom:-95px;height:185px;border-radius:50% 50% 0 0;
  background:radial-gradient(ellipse at 50% 0%, #450a0a 0%, #1f0406 65%, #090102 100%);
  border-top:2px solid rgba(239,68,68,.35);
  box-shadow:0 -14px 45px rgba(220,38,38,.18);
}

/* Starfield Canvas */
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.9}

/* Top Navigation Tabs */
.nav-bar{
  position:relative;z-index:2;max-width:880px;width:100%;
  margin:14px auto 0;padding:0 16px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.tab-btn{
  background:var(--card-glass);backdrop-filter:blur(10px);
  border:2px solid var(--line);border-radius:999px;
  padding:8px 18px;font:700 15px Fredoka,sans-serif;
  color:var(--mute);display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
.tab-btn:hover{border-color:var(--org);color:var(--ink)}
.tab-btn.active{
  background:var(--org);color:var(--onorg);border-color:var(--org);
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}

main{position:relative;z-index:1;max-width:880px;width:100%;margin:0 auto;padding:8px 16px 16px;flex:1}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;margin:.2em 0}
h1{font-size:clamp(28px,6vw,44px);line-height:1.1}

/* Guide / Readme View */
.guide-hero{
  background:linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.01));
  border-left:6px solid var(--org);
}
.guide-list{margin:8px 0 4px;padding-left:20px}
.guide-list li{margin:7px 0}
.formula-box{
  background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin:8px 0;font-size:14px;
}
.formula-box code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--teal);font-weight:700;
}

/* Credits Footer */
.credits-footer{
  position:relative;
  z-index:1;
  max-width:880px;
  width:100%;
  margin:8px auto 20px;
  padding:0 16px;
  text-align:center;
}
.credits-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--card-glass);
  backdrop-filter:blur(10px);
  border:1.5px solid var(--line);
  border-radius:999px;
  padding:8px 18px;
  font-size:13px;
  color:var(--mute);
  box-shadow:0 6px 20px rgba(0,0,0,.28);
  transition:border-color .3s,transform .2s;
}
.credits-pill:hover{
  border-color:var(--org);
  transform:translateY(-1px);
}
.credits-pill b{
  font-family:Fredoka,sans-serif;
  color:var(--org);
  letter-spacing:.3px;
  font-size:14px;
}

/* Cards & Entrance */
.card{
  background:var(--card-glass);backdrop-filter:blur(10px);
  border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;
  box-shadow:0 8px 28px rgba(0,0,0,.35);
  transition:border-color .25s,transform .25s,background-color .4s;
}
.pop-in{animation:popIn .38s cubic-bezier(.22,1,.36,1) both}
@keyframes popIn{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Shake on crisis */
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  10%,90%{transform:translate3d(-2px,0,0)}
  20%,80%{transform:translate3d(4px,0,0)}
  30%,50%,70%{transform:translate3d(-6px,0,0)}
  40%,60%{transform:translate3d(6px,0,0)}
}

/* Buttons */
button{font:inherit;cursor:pointer;color:var(--ink);transition:transform .12s ease,border-color .2s,background-color .2s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.94)}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}

.big{
  background:var(--org);color:var(--onorg);border:0;border-radius:999px;
  padding:12px 28px;font:700 18px Fredoka,sans-serif;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.big:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.big:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.big.ready{animation:pulseBtn 2s infinite}
@keyframes pulseBtn{
  0%,100%{box-shadow:0 4px 14px rgba(255,255,255,.15)}
  50%{box-shadow:0 4px 24px var(--org)}
}

/* Site Selection */
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px}
.site{
  text-align:left;background:var(--card-glass);border:2px solid var(--line);
  border-radius:18px;padding:18px;position:relative;overflow:hidden;
}
.site[data-k="moon"]:hover{border-color:#cbd5e1;transform:translateY(-4px);box-shadow:0 12px 28px rgba(203,213,225,.18)}
.site[data-k="mars"]:hover{border-color:#ef4444;transform:translateY(-4px);box-shadow:0 12px 28px rgba(239,68,68,.24)}
.site b{font:700 22px Fredoka;display:flex;align-items:center;gap:8px}
.site .planet{display:inline-block;animation:float 3.6s ease-in-out infinite}
.site:nth-child(2) .planet{animation-delay:-1.8s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tag{
  display:inline-block;margin-top:8px;font-size:12px;font-weight:700;
  color:var(--teal);background:rgba(63,210,192,.12);border:1px solid rgba(63,210,192,.35);
  padding:3px 9px;border-radius:999px;
}

/* NASA Resources List */
.res-list{margin:8px 0 0;padding-left:18px}
.res-list li{margin:6px 0;font-size:14px}
.res-list a{color:var(--teal);text-decoration:underline;text-underline-offset:2px}
.res-list a:hover{color:var(--yel)}

/* Live Outpost Viewport */
.scene{
  position:relative;height:112px;border-radius:14px;overflow:hidden;
  border:2px solid var(--line);margin-bottom:12px;
  transition:background 1s ease;
}
.scene.moon-day{background:linear-gradient(180deg,#090d1a 0%,#1a243d 70%,#646e82 70%,#474f61 100%)}
.scene.moon-night{background:linear-gradient(180deg,#04060c 0%,#0b1020 70%,#2a3040 70%,#1b202c 100%)}
.scene.mars-day{background:linear-gradient(180deg,#1f0507 0%,#631318 70%,#991b1b 70%,#5c0f12 100%)}
.scene.mars-storm{background:linear-gradient(180deg,#290a08 0%,#591914 70%,#782219 70%,#47120d 100%)}

.celestial{
  position:absolute;top:14px;right:24px;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle,#fff7d6 20%,#ffd166 70%,transparent 100%);
  box-shadow:0 0 24px #ffd166;transition:all .8s ease;
}
.scene.moon-night .celestial{opacity:.15;transform:translateY(36px) scale(.6)}
.scene.mars-day .celestial,.scene.mars-storm .celestial{width:20px;height:20px;opacity:.85}
.scene.mars-storm .celestial{opacity:.2}

.base-hab{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;align-items:flex-end;gap:14px;font-size:26px;
}
.hab-dome{
  background:var(--card);border:2px solid var(--line);border-radius:22px 22px 4px 4px;
  padding:4px 14px;font-size:22px;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.3);
}
.hab-shield{
  position:absolute;inset:-4px -4px auto -4px;height:8px;
  background:#7c859e;border-radius:12px 12px 0 0;transition:height .4s ease;
}
.prop-icon{display:inline-block;animation:hum 2.4s ease-in-out infinite}
.prop-icon:nth-child(2){animation-delay:-.8s}
.prop-icon:nth-child(3){animation-delay:-1.6s}
@keyframes hum{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.scene-badge{
  position:absolute;top:10px;left:12px;background:rgba(10,12,20,.78);
  color:#eef1f8;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;
  backdrop-filter:blur(4px);
}
.storm-wind{
  position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(-15deg,rgba(239,68,68,.22) 0 12px,transparent 12px 28px);
  animation:wind 1.2s linear infinite;
}
@keyframes wind{from{background-position:0 0}to{background-position:120px 0}}
.flare-wave{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at top right,rgba(255,93,108,.45),transparent 65%);
  animation:flarePulse 1.5s ease-in-out infinite;
}
@keyframes flarePulse{0%,100%{opacity:.4}50%{opacity:1}}

/* Meters */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.m{font-size:14px;padding:6px 8px;border-radius:12px;transition:background-color .4s}
.m.danger{animation:dangerPulse 1.4s ease-in-out infinite;background:rgba(255,93,108,.12)}
@keyframes dangerPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}50%{box-shadow:0 0 0 3px rgba(255,93,108,.35)}}
.m .t{display:flex;justify-content:space-between;font-weight:700;align-items:center}
.delta{font-size:12px;margin-left:5px;font-weight:700;animation:fadeSlide .6s ease both}
.delta.up{color:var(--grn)}.delta.dn{color:var(--red)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px;position:relative}
.bar i{
  display:block;height:100%;border-radius:9px;
  transition:width .65s cubic-bezier(.22,1,.36,1),background-color .4s;
  position:relative;overflow:hidden;
}
.bar i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  animation:shimmer 2.4s infinite;
}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sub{color:var(--mute);font-size:13px}

/* Actions */
.act{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);border-radius:10px;transition:background-color .2s}
.act:hover{background:rgba(255,255,255,.03)}
.act:first-of-type{border-top:0}
.act b{font-family:Fredoka;font-size:18px}
.act-ic{display:inline-block;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.act:hover .act-ic{transform:scale(1.2) rotate(-6deg)}

.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:22px;line-height:1}
.step button:hover:not(:disabled){border-color:var(--org);background:rgba(255,255,255,.08)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step span{min-width:22px;text-align:center;font:700 20px Fredoka;display:inline-block}
.bump{animation:bump .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.4);color:var(--org)}100%{transform:scale(1)}}

/* Alerts & Pips */
.alert{border-left:6px solid var(--yel);background:var(--card-glass);padding:10px 14px;border-radius:10px;margin:8px 0;animation:popIn .3s ease both}
.alert.bad{border-color:var(--red)}
.pips{display:flex;gap:7px;align-items:center}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--org);transition:transform .25s cubic-bezier(.34,1.56,.64,1),background-color .25s,box-shadow .25s}
.pip.on{background:var(--org);transform:scale(1.08);box-shadow:0 0 10px var(--org)}

.log p{margin:6px 0;font-size:14px;animation:popIn .3s ease both}
.log{max-height:240px;overflow:auto}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.lv{font-size:13px;color:var(--org);font-weight:700;margin-left:6px}

/* Floating feedback toast */
.floater{
  position:fixed;pointer-events:none;z-index:50;font:700 18px Fredoka,sans-serif;
  color:var(--yel);text-shadow:0 2px 8px rgba(0,0,0,.6);
  animation:floatUp .85s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translate(-50%,0) scale(.8)}
  30%{transform:translate(-50%,-16px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1)}
}

/* Astronaut Victory Popup */
.astro-backdrop{
  position:fixed;inset:0;z-index:70;
  background:rgba(6,10,20,.78);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:18px;
  animation:fadeIn .25s ease both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.astro-modal{
  position:relative;max-width:420px;width:100%;text-align:center;
  background:radial-gradient(circle at top,var(--line) 0%,var(--card) 68%);
  border:2px solid var(--yel);border-radius:24px;padding:28px 22px 24px;
  box-shadow:0 18px 48px rgba(0,0,0,.65);
  animation:astroPop .48s cubic-bezier(.22,1.35,.36,1) both;
}
@keyframes astroPop{
  from{opacity:0;transform:translateY(36px) scale(.82)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.astro-stage{
  position:relative;width:128px;height:128px;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;
}
.astro-halo{
  position:absolute;inset:8px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,209,102,.35),rgba(63,210,192,.12) 60%,transparent 75%);
  animation:haloSpin 6s linear infinite;
}
@keyframes haloSpin{from{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.08)}to{transform:rotate(360deg) scale(1)}}
.astro-figure{
  position:relative;z-index:1;font-size:74px;line-height:1;
  animation:astroFloat 2.4s ease-in-out infinite;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));
}
@keyframes astroFloat{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-9px) rotate(4deg)}
}
.astro-wave{
  position:absolute;top:14px;right:8px;z-index:2;font-size:28px;
  transform-origin:bottom left;
  animation:waveHand 1.1s ease-in-out infinite;
}
@keyframes waveHand{
  0%,100%{transform:rotate(0deg)}
  30%{transform:rotate(24deg)}
  60%{transform:rotate(-10deg)}
}
.astro-badge{
  display:inline-block;background:rgba(255,209,102,.16);border:1px solid var(--yel);
  color:var(--yel);font:700 13px Fredoka,sans-serif;padding:4px 12px;border-radius:999px;
  margin-bottom:6px;
}
.astro-modal h2{font-size:28px;color:var(--ink);margin:4px 0}
.astro-modal p{margin:8px 0;color:var(--mute)}
.astro-modal .astro-stats{
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
  margin:14px 0 18px;font-weight:700;color:var(--ink);
}
.astro-modal .astro-stats span{
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  padding:5px 12px;border-radius:12px;font-size:14px;
}

/* Confetti on win */
.confetti{
  position:fixed;top:-12px;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:80;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(105vh) rotate(720deg);opacity:0}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #stars{display:none}
}
</style>
</head>
<body>
<div id="backdrop-art" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<nav class="nav-bar" aria-label="Primary navigation">
  <button class="tab-btn active" id="tab-mission" type="button">🚀 Mission</button>
  <button class="tab-btn" id="tab-guide" type="button">📘 Guide / Readme</button>
</nav>

<main id="app"></main>

<footer class="credits-footer">
  <div class="credits-pill">
    <span>👨‍🚀 Credits: </span>
    <b>adi-unfazed</b>
  </div>
</footer>

<script>
/* Theme Manager: Default Space, Moon Mode, or Mars Mode */
function setThemeMode(mode){
  if(mode){
    document.documentElement.setAttribute("data-site",mode);
  }else{
    document.documentElement.removeAttribute("data-site");
  }
}

/* Animated Starfield (adapts star tint to current mode) */
(function initStars(){
  const c=document.getElementById("stars"),ctx=c.getContext("2d");
  let w,h,stars=[];
  function resize(){
    w=c.width=window.innerWidth;h=c.height=window.innerHeight;
    stars=Array.from({length:Math.min(125,Math.floor(w*h/10000))},()=>({
      x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.4,
      a:Math.random()*Math.PI*2,s:Math.random()*.025+.008,
      warm:Math.random()>.6
    }));
  }
  window.addEventListener("resize",resize);resize();
  function draw(){
    ctx.clearRect(0,0,w,h);
    const mode=document.documentElement.getAttribute("data-site");
    for(const st of stars){
      st.a+=st.s;
      const alpha=.25+.75*(.5+.5*Math.sin(st.a));
      if(mode==="mars"){
        ctx.fillStyle=st.warm?`rgba(255,140,120,${alpha.toFixed(2)})`:`rgba(254,226,226,${(alpha*.8).toFixed(2)})`;
      }else if(mode==="moon"){
        ctx.fillStyle=st.warm?`rgba(226,232,240,${alpha.toFixed(2)})`:`rgba(186,230,253,${alpha.toFixed(2)})`;
      }else{
        ctx.fillStyle=st.warm?`rgba(238,241,248,${alpha.toFixed(2)})`:`rgba(165,243,252,${(alpha*.9).toFixed(2)})`;
      }
      ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)draw();
})();

function spawnFloater(x,y,text,color="var(--yel)"){
  const el=document.createElement("div");
  el.className="floater";el.textContent=text;
  el.style.left=x+"px";el.style.top=y+"px";el.style.color=color;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

function launchConfetti(){
  const colors=["#ff8a3d","#3fd2c0","#8bd45a","#ffd166","#ff5d6c"];
  for(let i=0;i<55;i++){
    const d=document.createElement("div");
    d.className="confetti";
    d.style.left=Math.random()*100+"vw";
    d.style.background=colors[i%colors.length];
    d.style.animationDuration=(1.8+Math.random()*2)+"s";
    d.style.animationDelay=(Math.random()*.5)+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),4200);
  }
}

function showAstronautPopup({siteIcon,rank,score,hp,sci}){
  const backdrop=document.createElement("div");
  backdrop.className="astro-backdrop";
  backdrop.setAttribute("role","dialog");
  backdrop.setAttribute("aria-modal","true");
  backdrop.setAttribute("aria-labelledby","astro-title");
  backdrop.innerHTML=`
    <div class="astro-modal">
      <div class="astro-badge">${siteIcon} 30 SOLS COMPLETE</div>
      <div class="astro-stage" aria-hidden="true">
        <div class="astro-halo"></div>
        <div class="astro-figure">👨‍🚀</div>
        <div class="astro-wave">👋</div>
      </div>
      <h2 id="astro-title">We Made It, Commander!</h2>
      <p>All 4 crew members are safe and smiling at Mission Control.</p>
      <div class="astro-stats">
        <span>🏅 ${rank}</span>
        <span>⭐ ${score} pts</span>
        <span>❤️ ${Math.round(hp)}%</span>
        <span>🔬 ${sci}</span>
      </div>
      <button class="big ready" id="astro-close">Continue to debrief</button>
    </div>`;
  const close=()=>backdrop.remove();
  backdrop.onclick=(e)=>{if(e.target===backdrop)close()};
  document.body.appendChild(backdrop);
  const btn=backdrop.querySelector("#astro-close");
  btn.onclick=close;
  btn.focus();
}

];

const SITES={
  moon:{
    n:"Moon: Shackleton Rim",
    ic:"🌙",
    rad:6,
    flare:14,
    dataset:"LRO Diviner & LOLA (Shackleton Crater Rim)",
    info:"No air to block radiation. Nights last about 2 weeks in real life, so we squeeze them into short, sneaky blackouts. Batteries matter!",
    sun:s=>(s%10>=6)?0.1:1,

  },

};
const ACT=[
  ["solar","☀️","Build solar panels","More power. Everything else needs power."],
  ["o2","💨","Upgrade oxygen plant","Splits water into breathable oxygen. Uses power."],
  ["farm","🌱","Grow the greenhouse","Makes food. Grow lights use a lot of power."],

];
const NAMES={solar:"solar panels",o2:"oxygen plant",farm:"greenhouse"};
let G,P,prevStats=null,shakeNext=false,activeView="mission",app=document.getElementById("app");
const r=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));

function setActiveTab(tab){
  activeView=tab;
  document.getElementById("tab-mission").classList.toggle("active",tab==="mission");
  document.getElementById("tab-guide").classList.toggle("active",tab==="guide");
  if(tab==="guide"){

  }else if(G){

  }else{
    intro();
  }
}

document.getElementById("tab-mission").onclick=()=>setActiveTab("mission");
document.getElementById("tab-guide").onclick=()=>setActiveTab("guide");

function renderGuide(){
  app.innerHTML=`<div class="pop-in">
    <h1>📘 Mission Guide & Readme</h1>
    <div class="card guide-hero">
      <h2>HELLO EVERYONE, Let me brief you on how the game works.</h2>
      <p>The game is a loop. You plan a sol, press <b>“End sol”</b>, the game works out what happened, and the screen redraws.</p>
    </div>

    <div class="card">
      <h3>Your turn</h3>
      <p>Each sol you have <b>4 crew-hours</b> to spend with the <code>+</code> and <code>−</code> buttons:</p>
      <ul class="guide-list">
        <li><b>Building (solar, oxygen plant, greenhouse, shielding):</b> Raises its level by <b>1</b> per crew-hour, up to <b>level 8</b>.</li>
        <li><b>Science:</b> Gives <b>10 points</b> per crew-hour.</li>
        <li><b>Rest:</b> Heals <b>4 health</b> per crew-hour.</li>
      </ul>
      <p>You have to spend all <b>4</b> crew-hours before you can end the sol.</p>
    </div>

    <div class="card">
      <h3>What happens when you end the sol</h3>
      <p>The game resolves things in this order:</p>
      <ul class="guide-list">
        <li><b>Power:</b> Panels make <code>solar level × 4 × sunlight</code>. Demand is <code>4 + oxygen level × 1.5 + greenhouse level × 2</code>. Any surplus charges the battery (max <b>100</b>). If the battery plus panel output can’t cover demand, the battery drops to <b>0</b> and the oxygen plant and greenhouse run at a reduced percentage. That’s a <b>brownout</b>.</li>
        <li><b>Life support:</b> Oxygen changes by <code>plant level × 3 × power ratio − 4</code>, because the crew breathes <b>4</b> per sol. Food works the same way with the greenhouse. Both are capped at <b>0–100</b>.</li>
        <li><b>Radiation:</b> Daily dose is <code>max(0, site radiation − shield level × 1.2)</code>. A solar flare adds <code>max(0, flare strength − shield level × 2.2)</code>. Crew health drops by <b>0.6</b> per unit of dose. On the Moon, <b>shield level 5</b> cancels the daily dose entirely.</li>
        <li><b>Emergencies:</b> If oxygen hits <b>0</b>, health drops <b>25</b>. If food hits <b>0</b>, it drops <b>12</b>. A meteor shower knocks one random system (solar, oxygen, or greenhouse) down a level.</li>
        <li><b>Win or lose:</b> Health at <b>0</b> ends the mission. Surviving <b>sol 30</b> wins, with score:

        <li>On Mars, sunlight is always weak and dust storms cut it further.</li>
        <li>Shielding does nothing visible until a flare or a long stretch of radiation, so it’s tempting to skip.</li>
        <li>Science feels rewarding but doesn’t keep anyone alive.</li>
      </ul>
      <p style="text-align:center;margin-top:14px">
        <button class="big ready" id="back-to-game">🚀 Back to Mission</button>
      </p>

function nasaResourcesHtml(){
  return `<div class="card">
    <h3>🛰️ NASA Datasets & Resources Used</h3>
    <ul class="res-list">
      ${NASA_RESOURCES.map(item=>`<li><a href="${item.url}" target="_blank" rel="noopener noreferrer"><b>${item.name}</b></a> — ${item.usedIn}</li>`).join("")}
    </ul>
  </div>`;
}

function intro(){
  G=null;
  setThemeMode(null);
  prevStats=null;
  app.innerHTML=`<div class="pop-in">
    <h1>🚀 Junior Astronaut Mission Trainer</h1>
    <p>You are Mission Commander. Keep <b>4 crew</b> alive for <b>30 sols</b> (days). Every sol you get <b>4 crew-hours</b> to spend. Power runs the oxygen plant and greenhouse, shielding protects against radiation, and science earns your score. You can’t do everything, so choose wisely!</p>
    <h2>Pick your outpost</h2>
    <div class="sites">${Object.entries(SITES).map(([k,s])=>`
      <button class="site" data-k="${k}">
        <b><span class="planet">${s.ic}</span> ${s.n}</b>
        <p>${s.info}</p>
        <span class="tag">📊 ${s.dataset}</span>
      </button>`).join("")}
    </div>
    ${nasaResourcesHtml()}
  </div>`;
  app.querySelectorAll(".site").forEach(b=>b.onclick=()=>start(b.dataset.k));
}

function start(k){
  setThemeMode(k);
  const S=SITES[k],ev={};
  const put=(s,t)=>{ev[s]=ev[s]||[];ev[s].push(t)};
  for(let i=0;i<S.flares;i++)put(r(4,27),"flare");
  for(let i=0;i<S.storms;i++){const s=r(5,24);for(let j=0;j<3;j++)put(s+j,"storm")}
  for(let i=0;i<2;i++)put(r(6,28),"meteor");
  G={k,S,ev,sol:1,lv:{solar:3,o2:1,farm:1,shield:1},bat:60,o2:40,food:40,hp:100,sci:0,log:[],last:null};
  P={solar:0,o2:0,farm:0,shield:0,sci:0,rest:0};
  prevStats=null;
  render(true);
}

const used=()=>Object.values(P).reduce((a,b)=>a+b,0);

function meter(key,l,v,c,note){
  const prev=prevStats?prevStats[key]:v;
  const diff=Math.round(v-prev);
  const deltaHtml=diff!==0?`<span class="delta ${diff>0?"up":"dn"}">${diff>0?"+":""}${diff}</span>`:"";
  const danger=v<25?"danger":"";
  return `<div class="m ${danger}">
    <div class="t"><span>${l}</span><span>${Math.round(v)}${deltaHtml}</span></div>
    <div class="bar"><i style="width:${cl(v)}%;background:${v<25?"var(--red)":c}"></i></div>
    <div class="sub">${note||""}</div>
  </div>`;
}

function sunNow(){
  let s=G.S.sun(G.sol);
  if((G.ev[G.sol]||[]).includes("storm"))s=Math.min(s,.2);
  return s;
}

function render(animateCards=false,bumpedKey=null){
  const g=G,sun=sunNow(),gen=g.lv.solar*4*sun,dem=4+g.lv.o2*1.5+g.lv.farm*2;
  const now=g.ev[g.sol]||[],nxt=g.ev[g.sol+1]||[];
  let al="";
  if(now.includes("flare"))al+=`<div class="alert bad">☢️ A solar flare hits at the end of this sol. Shielding decides how much radiation gets in.</div>`;
  if(now.includes("storm"))al+=`<div class="alert">🌪️ Dust storm: solar panels make only a fifth of their power today.</div>`;
  if(nxt.includes("flare"))al+=`<div class="alert">📡 Mission Control: solar flare expected next sol.</div>`;
  if(nxt.includes("storm")&&!now.includes("storm"))al+=`<div class="alert">📡 Mission Control: dust storm expected next sol.</div>`;
  if(sun<.5&&!now.includes("storm")&&g.k==="moon")al+=`<div class="alert">🌑 Lunar night: panels make almost no power. The battery must carry you.</div>`;

  const left=4-used();
  const sceneClass=g.k==="moon"?(sun<.5?"moon-night":"moon-day"):(now.includes("storm")?"mars-storm":"mars-day");
  const weatherLabel=now.includes("flare")?"☢️ Solar Flare Incoming":now.includes("storm")?"🌪️ Dust Storm":(g.k==="moon"&&sun<.5?"🌑 Lunar Night":"☀️ Nominal Operations");

  app.innerHTML=`
    <div class="top ${animateCards?"pop-in":""}">
      <h2>${g.S.ic} Sol ${g.sol} of 30</h2>
      <div class="pips" aria-label="${left} crew-hours left" title="${left} crew-hours remaining">
        ${[0,1,2,3].map(i=>`<span class="pip ${i<left?"on":""}"></span>`).join("")}
      </div>
    </div>
    ${al}
    <div class="card ${animateCards?"pop-in":""} ${shakeNext?"shake":""}">
      <div class="scene ${sceneClass}" aria-hidden="true">
        <div class="scene-badge">${weatherLabel} · Sun ${Math.round(sun*100)}%</div>
        <div class="celestial"></div>
        ${now.includes("storm")?'<div class="storm-wind"></div>':''}
        ${now.includes("flare")?'<div class="flare-wave"></div>':''}
        <div class="base-hab">
          <span class="prop-icon">☀️×${g.lv.solar+P.solar}</span>
          <div class="hab-dome">
            <div class="hab-shield" style="height:${3+(g.lv.shield+P.shield)*2}px"></div>
            🏠 👨‍🚀
          </div>
          <span class="prop-icon">🌱×${g.lv.farm+P.farm}</span>
          <span class="prop-icon">💨×${g.lv.o2+P.o2}</span>
        </div>
      </div>
      <div class="meters">
        ${meter("bat","🔋 Battery",g.bat,"var(--yel)",`Making ${gen.toFixed(1)} · using ${dem.toFixed(1)} per sol`)}
        ${meter("o2","💨 Oxygen",g.o2,"var(--teal)",`Plant makes ${g.lv.o2*3}, crew breathes 4`)}
        ${meter("food","🍲 Food",g.food,"var(--grn)",`Greenhouse makes ${g.lv.farm*3}, crew eats 4`)}
        ${meter("hp","❤️ Crew health",g.hp,"var(--org)",`Radiation per sol: about ${Math.max(0,g.S.rad-g.lv.shield*1.2).toFixed(1)}`)}
      </div>
      <p class="sub" style="margin-bottom:0">🔬 Science points: <b>${g.sci}</b> · Sunlight today: ${Math.round(sun*100)}% · Dataset: <b>${g.S.dataset}</b></p>
    </div>
    <div class="card ${animateCards?"pop-in":""}">
      <h3>Plan your sol (4 crew-hours)</h3>
      ${ACT.map(([k,ic,n,d])=>`
        <div class="act">
          <div>
            <b><span class="act-ic">${ic}</span> ${n}</b>
            ${g.lv[k]?`<span class="lv">Level ${g.lv[k]}${P[k]?` → ${g.lv[k]+P[k]}`:""}</span>`:""}
            <div class="sub">${d}</div>
          </div>
          <div class="step">
            <button data-k="${k}" data-d="-1" aria-label="Less ${n}" ${P[k]?"":"disabled"}>−</button>
            <span class="${bumpedKey===k?"bump":""}">${P[k]}</span>
            <button data-k="${k}" data-d="1" aria-label="More ${n}" ${left&&(!g.lv[k]||g.lv[k]+P[k]<8)?"":"disabled"}>+</button>
          </div>
        </div>`).join("")}
      <p style="text-align:center;margin-bottom:4px">
        <button class="big ${left===0?"ready":""}" id="go" ${left?"disabled":""}>
          ${left?`Spend ${left} more crew-hour${left>1?"s":""}`:"🚀 End sol"}
        </button>
      </p>
    </div>
    <div class="card log ${animateCards?"pop-in":""}">
      <h3>Mission log</h3>
      ${g.log.length?g.log.map(l=>`<p>${l}</p>`).join(""):'<p class="sub">Your first sol is waiting. Tip: the oxygen plant and greenhouse start too small for 4 crew.</p>'}
    </div>`;

  shakeNext=false;
  app.querySelectorAll(".step button").forEach(b=>b.onclick=(e)=>{
    const k=b.dataset.k,delta=+b.dataset.d;
    P[k]+=delta;
    const rect=b.getBoundingClientRect();
    spawnFloater(rect.left+rect.width/2,rect.top,delta>0?"+1 hr":"−1 hr",delta>0?"var(--teal)":"var(--mute)");
    render(false,k);
  });
  document.getElementById("go").onclick=(e)=>{
    const rect=e.target.getBoundingClientRect();
    if(P.sci>0)spawnFloater(rect.left+rect.width/2,rect.top,`+${P.sci*10} 🔬`,"var(--yel)");
    endSol();
  };
}

function endSol(){
  const g=G,L=[],now=g.ev[g.sol]||[];
  prevStats={bat:g.bat,o2:g.o2,food:g.food,hp:g.hp};
  let crisis=false;

  for(const k of["solar","o2","farm","shield"])g.lv[k]=Math.min(8,g.lv[k]+P[k]);
  g.sci+=P.sci*10;g.hp=cl(g.hp+P.rest*4);

  const sun=sunNow(),gen=g.lv.solar*4*sun,dem=4+g.lv.o2*1.5+g.lv.farm*2,avail=g.bat+gen;
  let ratio=1;
  if(avail>=dem){g.bat=Math.min(100,avail-dem)}
  else{ratio=avail/dem;g.bat=0;crisis=true;L.push(`⚡ <b>Brownout!</b> Power ran short, so the oxygen plant and greenhouse ran at ${Math.round(ratio*100)}%.`)}

  g.o2=cl(g.o2+g.lv.o2*3*ratio-4);
  g.food=cl(g.food+g.lv.farm*3*ratio-4);

  let dose=Math.max(0,g.S.rad-g.lv.shield*1.2);
  if(now.includes("flare")){
    const f=Math.max(0,g.S.flare-g.lv.shield*2.2);
    dose+=f;
    if(f>0)crisis=true;
    L.push(f>0?`☢️ Solar flare! Shielding stopped some of it, but the crew still absorbed extra radiation.`:`☢️ Solar flare! Your thick shielding blocked it completely.`);
  }
  if(now.includes("meteor")){
    const k=["solar","o2","farm"][r(0,2)];
    if(g.lv[k]>1){g.lv[k]--;crisis=true;L.push(`☄️ Micrometeoroids damaged the ${NAMES[k]}. It dropped to level ${g.lv[k]}.`)}
    else L.push(`☄️ Micrometeoroids pinged the roof but did no harm.`);
  }

  let loss=dose*.6;
  if(g.o2<=0){loss+=25;crisis=true;L.push("🚨 The crew ran out of oxygen!")}
  if(g.food<=0){loss+=12;crisis=true;L.push("🚨 The crew is starving!")}
  else if(loss===0&&!P.rest)g.hp=cl(g.hp+1);

  g.hp=cl(g.hp-loss);
  L.unshift(`Sol ${g.sol}: power ${gen.toFixed(1)} in / ${dem.toFixed(1)} out, radiation ${dose.toFixed(1)}, health ${loss>0?"−"+loss.toFixed(1):"steady"}.`);
  if(g.o2<25&&g.o2>0)L.push("⚠️ Oxygen is low.");
  if(g.food<25&&g.food>0)L.push("⚠️ Food is low.");

  g.last={dose,ratio};
  g.log=[...L,...g.log].slice(0,40);
  g.sol++;
  P={solar:0,o2:0,farm:0,shield:0,sci:0,rest:0};
  shakeNext=crisis;

  if(g.hp<=0)return end(false);
  if(g.sol>30)return end(true);
  render(true);
}

function end(ok){
  const g=G;
  const sc=Math.round(g.sci+g.hp*2+(g.o2+g.food)/2);
  const rank=!ok?"Rookie (try again!)":sc>420?"Mission Commander":sc>300?"Flight Engineer":"Astronaut Pilot";
  const cause=g.o2<=0?"Oxygen ran out. Life support needs power and a big enough plant for every crew member.":g.food<=0?"Food ran out. A greenhouse must grow as much as the crew eats, and its lights need power.":"Radiation wore the crew down. Thicker shielding cuts exposure every single sol.";

  if(ok){
    launchConfetti();
    showAstronautPopup({siteIcon:g.S.ic,rank,score:sc,hp:g.hp,sci:g.sci});
  }

  app.innerHTML=`<div class="pop-in ${!ok?"shake":""}">
    <h1>${ok?"🎉 Mission success!":"💥 Mission failed"}</h1>
    <div class="card">
      <h2>${ok?`All 4 crew made it through 30 sols.`:`The crew was lost on sol ${g.sol-1}.`}</h2>
      <p>Rank: <b>${rank}</b> · Score: <b>${sc}</b> (science ${g.sci}, health ${Math.round(g.hp)}) · Site dataset: <b>${g.S.dataset}</b></p>
      <h3>What engineers learn from this</h3>
      <p>${ok?"You balanced power, life support, and shielding. Real mission planners do the same, and they also add spare capacity for surprises like meteor hits.":cause}</p>
      <p class="sub">Everything is linked: more oxygen and food need more power; more power needs more panels or batteries; more building leaves less time for science. That’s called a trade-off.</p>
      <p><button class="big ready" id="again">Play again</button></p>
    </div>
    ${nasaResourcesHtml()}
    <div class="card log">
      <h3>Final log</h3>
      ${g.log.slice(0,12).map(l=>`<p>${l}</p>`).join("")}
    </div>
  </div>`;
  document.getElementById("again").onclick=intro;
}

intro();
</script>
